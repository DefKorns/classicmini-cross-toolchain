name: gcc13-image

# Publishes ghcr.io/defkorns/classicmini-gcc13 (Dockerfile.gcc13-armhf: GCC 13.3
# cross-compiler for sources that need C++17). It is a separate package and never
# touches the other images' tags. Compiling GCC takes a long time, so it only runs
# when its Dockerfile changes, on a gcc13-v* tag or by hand.
#
# Tags: sha-<7 chars> for every build, gcc13 for master's latest, and v<x.y.z>
# for a git tag gcc13-v<x.y.z>.
on:
  push:
    branches: [master]
    paths: [Dockerfile.gcc13-armhf, .github/workflows/gcc13-image.yml]
    tags: ['gcc13-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          repo=$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')
          image=ghcr.io/${repo%/*}/classicmini-gcc13
          tags="$image:sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/tags/gcc13-v*) tags="$tags,$image:${GITHUB_REF#refs/tags/gcc13-}" ;;
            *) tags="$tags,$image:gcc13" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.gcc13-armhf
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=gcc13
          cache-to: type=gha,scope=gcc13,mode=max
