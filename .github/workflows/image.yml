name: image

# Publishes ghcr.io/defkorns/classicmini-cross-toolchain, tagged with the
# commit (sha-<7 chars>) so consumers pull the exact version their submodule
# pins, plus jessie-armhf for master's latest.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')
          tags="$image:sha-${GITHUB_SHA::7}"
          [ "$GITHUB_REF" = refs/heads/master ] && tags="$tags,$image:jessie-armhf"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags,$image:${GITHUB_REF#refs/tags/}" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.jessie-armhf
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
